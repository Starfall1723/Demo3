services:
  - type: web
    name: starfalltxt
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: packs
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
